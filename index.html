<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout with Float and Forms Design</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Website Header</h1>
    </header>

    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
            <li><a href="login.html">Login</a></li>
            <li><a href="register.html">Register</a></li>
        </ul>
    </nav>

    <aside>
        <h2>Sidebar Menu</h2>
        <ul>
            <li><a href="#">Link 1</a></li>
            <li><a href="#">Link 2</a></li>
            <li><a href="#">Link 3</a></li>
            <li><a href="#">Link 4</a></li>
        </ul>
    </aside>

    <main>
        <h2>Content Area</h2>

        <form action="#" method="post">

            <label for="text">Text Input:</label>
            <input type="text" id="text" name="text"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email"><br><br>

            <label for="number">Number:</label>
            <input type="number" id="number" name="number"><br><br>

            <label for="tel">Phone:</label>
            <input type="tel" id="tel" name="tel"><br><br>

            <label for="url">Website:</label>
            <input type="url" id="url" name="url"><br><br>

            <label for="search">Search:</label>
            <input type="search" id="search" name="search"><br><br>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date"><br><br>

            <label for="time">Time:</label>
            <input type="time" id="time" name="time"><br><br>

            <label for="month">Month:</label>
            <input type="month" id="month" name="month"><br><br>

            <label for="week">Week:</label>
            <input type="week" id="week" name="week"><br><br>

            <label for="datetime">Date Time:</label>
            <input type="datetime-local" id="datetime" name="datetime"><br><br>

            <label for="color">Color:</label>
            <input type="color" id="color" name="color"><br><br>

            <label for="range">Range:</label>
            <input type="range" id="range" name="range"><br><br>

            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label>
            <br><br>

            <label>Hobbies:</label><br>

            <input type="checkbox" id="reading" name="hobby1" value="reading">
            <label for="reading">Reading</label>

            <input type="checkbox" id="gaming" name="hobby2" value="gaming">
            <label for="gaming">Gaming</label>

            <input type="checkbox" id="sports" name="hobby3" value="sports">
            <label for="sports">Sports</label>
            <br><br>

            <label for="textarea">Textarea:</label>
            <textarea id="textarea" name="textarea" rows="4" cols="50"></textarea>
            <br><br>

            <label for="select">Select:</label>
            <select id="select" name="select">
                <option value="option1">Option 1</option>
                <option value="option2">Option 2</option>
                <option value="option3">Option 3</option>
            </select>
            <br><br>

            <label for="browser">Choose Browser:</label>
            <input list="browsers" id="browser" name="browser">

            <datalist id="browsers">
                <option value="Chrome">
                <option value="Firefox">
                <option value="Edge">
                <option value="Opera">
                <option value="Safari">
            </datalist>
            <br><br>

            <label for="file">Upload File:</label>
            <input type="file" id="file" name="file">
            <br><br>

            <label>Progress:</label>
            <progress value="70" max="100"></progress>
            <br><br>

            <label>Meter:</label>
            <meter value="0.8">80%</meter>
            <br><br>

            <label>Output:</label>
            <output>100</output>
            <br><br>

            <input type="hidden" name="user_id" value="123">

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
            <input type="button" value="Button">

        </form>
    </main>

    <footer>
        <p>Website Footer</p>
    </footer>
</body>
</html>
